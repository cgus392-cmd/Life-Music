# Comprobacion de que el proyecto compila y sus pruebas pasan. Sin firmar y sin
# secretos: los APK que se publican se firman en el PC de CG con un keystore que
# nunca sube a GitHub. El flujo heredado de Echo intentaba firmar con secretos
# que aqui no existen y fallaba en cada push.
name: Android CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "web/**"
      - "**.md"
      - "supabase/**"
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Compilar y probar (FOSS, sin firmar)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore de depuracion desechable
        # AGP ya no lo genera solo en un runner limpio, y sin el la firma de la
        # variante debug falla. Es el mismo keystore "android/android" de siempre;
        # solo firma el APK de comprobacion, que no se publica.
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android             -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000             -dname "CN=Android Debug,O=Android,C=US"

      - name: Pruebas del motor de reproduccion
        run: |
          chmod +x gradlew
          ./gradlew :playback:testFossDebugUnitTest --no-daemon

      - name: Compilar la edicion FOSS (debug, sin firmar)
        run: ./gradlew assembleArm64FossDebug --no-daemon

      - name: Guardar el APK de comprobacion
        uses: actions/upload-artifact@v4
        with:
          name: lifemusic-arm64-foss-debug
          path: app/build/outputs/apk/arm64Foss/debug/*.apk
          retention-days: 7
