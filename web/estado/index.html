<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estado de Life Music</title>
<meta name="description" content="Estado en vivo de los servicios de Life Music: TV con navegador, comunidad, descargas y web.">
<meta name="theme-color" content="#0B0F0D">
<link rel="canonical" href="https://lifemusic.pages.dev/estado">
<link rel="icon" type="image/png" href="/img/lifemusic.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<!--
  Estado del sistema (1.3.2, ficha docs/versiones/1.3.2/tv-enlace-seguro.md §F).
  Se consulta en vivo desde este navegador: cada servicio tiene su /salud. Sin
  monitores de pago ni datos guardados.
-->
<style>
  :root{--fondo:#0B0F0D;--superficie:#131A16;--borde:rgba(255,255,255,.08);--texto:#F2F5F3;--texto-2:#A9B4AE;--texto-3:#6F7B75;--verde:#34D399;--rojo:#F87171;--ambar:#FBBF24;color-scheme:dark}
  @media (prefers-color-scheme:light){:root{--fondo:#F4F8F6;--superficie:#FFFFFF;--borde:rgba(10,30,20,.09);--texto:#0F1512;--texto-2:#4B5751;--texto-3:#7A867F;--verde:#0B8A5F;--rojo:#DC2626;--ambar:#B45309;color-scheme:light}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--fondo);color:var(--texto);font:16px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{width:min(720px,100% - 32px);margin:0 auto;padding:32px 0 56px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:28px}
  header img{width:40px;height:40px;border-radius:11px}
  header a{text-decoration:none;color:inherit;font-weight:800;font-size:18px}
  h1{font-size:clamp(28px,6vw,40px);line-height:1.1;margin:0 0 8px;letter-spacing:-.02em}
  .resumen{display:flex;align-items:center;gap:10px;font-weight:700;margin:0 0 28px;color:var(--texto-2)}
  .punto{flex:none;width:12px;height:12px;border-radius:50%;background:var(--texto-3)}
  .ok .punto{background:var(--verde);box-shadow:0 0 0 4px color-mix(in srgb,var(--verde) 20%,transparent)}
  .mal .punto{background:var(--rojo)}
  .lento .punto{background:var(--ambar)}
  ul{list-style:none;margin:0;padding:0;border-radius:20px;background:var(--superficie);border:1px solid var(--borde);overflow:hidden}
  li{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--borde)}
  li:last-child{border-bottom:0}
  li>div{flex:1;min-width:0}
  li b{display:block}
  li small{color:var(--texto-2)}
  .ms{font:500 14px "JetBrains Mono",ui-monospace,monospace;color:var(--texto-3);white-space:nowrap}
  .pie{margin-top:18px;font-size:14px;color:var(--texto-3)}
  button{font:inherit;font-weight:700;color:var(--texto);background:transparent;border:1px solid var(--borde);border-radius:99px;padding:8px 16px;cursor:pointer}
</style>
</head>
<body>
<main>
  <header><img src="/img/lifemusic.png" alt=""><a href="/">Life Music</a></header>
  <h1>Estado del sistema</h1>
  <p class="resumen" id="resumen"><span class="punto"></span><span id="resumen-texto">Revisando…</span></p>
  <ul id="lista"></ul>
  <p class="pie">Se revisa en vivo desde tu navegador. Última revisión: <span id="hora">—</span> · <button id="otra">Revisar otra vez</button></p>
</main>
<script>
  var SERVICIOS = [
    { nombre: "TV con navegador", detalle: "El relevo que enlaza el teléfono con el TV", url: "https://lifemusic-enlace.cho--usic.workers.dev/salud", ok: function (j) { return j && j.estado === "ok"; } },
    { nombre: "Comunidad", detalle: "Calificaciones y prerregistro del concurso", url: "https://lifemusic-comunidad.cho--usic.workers.dev/salud", ok: function (j) { return j && j.estado === "ok"; } },
    { nombre: "Descargas", detalle: "La última versión en GitHub", url: "https://api.github.com/repos/cgus392-cmd/Life-Music/releases/latest", ok: function (j) { return j && !!j.tag_name; } },
    { nombre: "Web", detalle: "lifemusic.pages.dev y la pantalla del TV", url: "/novedades/1.3.1.json", ok: function (j) { return !!j; } },
  ];
  var LENTO_MS = 1500;
  function fila(s) {
    var li = document.createElement("li");
    li.innerHTML = '<span class="punto"></span><div><b></b><small></small></div><span class="ms">…</span>';
    li.querySelector("b").textContent = s.nombre;
    li.querySelector("small").textContent = s.detalle;
    return li;
  }
  function revisar() {
    var lista = document.getElementById("lista");
    lista.innerHTML = "";
    var listos = 0, malos = 0, lentos = 0;
    SERVICIOS.forEach(function (s) {
      var li = fila(s);
      lista.appendChild(li);
      var t0 = performance.now();
      var control = new AbortController();
      var limite = setTimeout(function () { control.abort(); }, 8000);
      fetch(s.url, { cache: "no-store", signal: control.signal })
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; })
        .then(function (j) {
          clearTimeout(limite);
          var ms = Math.round(performance.now() - t0);
          var bien = s.ok(j);
          var clase = !bien ? "mal" : ms > LENTO_MS ? "lento" : "ok";
          li.className = clase;
          li.querySelector(".ms").textContent = bien ? ms + " ms" : "sin respuesta";
          if (!bien) malos++; else if (clase === "lento") lentos++;
          if (++listos === SERVICIOS.length) resumen(malos, lentos);
        });
    });
    document.getElementById("hora").textContent = new Date().toLocaleTimeString("es-CO");
  }
  function resumen(malos, lentos) {
    var r = document.getElementById("resumen");
    r.className = "resumen " + (malos ? "mal" : lentos ? "lento" : "ok");
    document.getElementById("resumen-texto").textContent = malos
      ? (malos === 1 ? "Un servicio no responde" : malos + " servicios no responden")
      : lentos ? "Todo funciona, algo lento" : "Todo funciona sin problemas";
  }
  document.getElementById("otra").onclick = revisar;
  revisar();
  setInterval(revisar, 60000);
</script>
</body>
</html>
