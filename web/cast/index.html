<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Life Music en tu TV</title>
<meta name="robots" content="noindex">
<!--
  Receptor de Google Cast de Life Music: el modo ambiente en el televisor.

  El Chromecast carga esta pagina cuando el telefono lanza la app registrada
  en la consola de Cast. El audio lo reproduce el propio TV con el reproductor
  de la Cast Application Framework (CAF), que entiende los mismos mensajes
  LOAD/PLAY/PAUSE/SEEK que el reproductor por defecto: el telefono no cambia
  como manda la musica. Lo que se anade es un canal propio
  (urn:x-cast:com.cglabs.lifemusic) por el que el telefono manda la letra
  sincronizada, los colores de la caratula y el tempo de la cancion; con eso
  esta pagina dibuja el modo ambiente y hace latir el fondo al ritmo real.

  Sin telefono en el navegador: abrir con ?demo=1 para verla con una cancion
  de mentira (la caratula se dibuja aqui, la letra es de relleno, no es de
  ninguna cancion).
-->
<link rel="icon" type="image/png" href="../img/lifemusic.png">
<link rel="stylesheet" href="receptor.css?v=20260921f">
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <!-- El reproductor de CAF existe pero no se ve: la pantalla es nuestra. -->
  <cast-media-player id="reproductor"></cast-media-player>

  <canvas id="fondo" width="384" height="216" aria-hidden="true"></canvas>

  <main id="escena" class="vacia">
    <header class="marca">
      <img src="../img/lifemusic.png" alt="" width="28" height="28">
      <span>Life Music</span>
    </header>

    <!-- Sin cancion: la bienvenida. -->
    <section id="bienvenida">
      <div class="logo-halo"><img src="../img/lifemusic.png" alt="Life Music" width="120" height="120"></div>
      <p id="saludo" class="saludo">Buenas noches</p>
      <h1>Listo para sonar</h1>
      <p id="saludo-estado" class="saludo-estado">Esperando al telefono…</p>
      <!-- Estado del arranque de Cast: para saber, mirando el TV, si la pagina llego a decir «lista». -->
      <p id="estado" class="estado"></p>
    </section>

    <!-- Con cancion: caratula a la izquierda, letra a la derecha. -->
    <section id="ambiente">
      <div id="izquierda">
        <div id="caratula-marco">
          <!-- La caratula la pone receptor.js (una <img class="caratula"> que se funde con la anterior). -->
          <!-- El canvas de la cancion (video corto en bucle, sin sonido), si lo tiene. -->
          <video id="canvas" muted loop playsinline preload="auto"></video>
        </div>
        <h2 id="titulo"></h2>
        <p id="artista"></p>
        <div id="progreso"><div id="progreso-barra"></div></div>
      </div>
      <div id="derecha">
        <div id="letra"></div>
        <p id="sin-letra">Esta cancion no tiene letra sincronizada</p>
      </div>
    </section>
  </main>

  <!-- El saludo de entrada de la app, en el TV: llega del telefono al conectar. -->
  <section id="saludo-pantalla" aria-live="polite">
    <p id="saludo-cabecera"></p>
    <p id="saludo-frase"></p>
  </section>

  <script src="receptor.js?v=20260921f"></script>
</body>
</html>
